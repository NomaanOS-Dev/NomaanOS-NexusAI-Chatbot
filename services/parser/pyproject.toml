[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-parser"
version = "0.1.0"
description = "NomaanOS Nexus AI extensible document extraction and normalization service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "NomaanOS Nexus AI Team" }
]
dependencies = [
    "pypdf>=5.0.0",
    "pyyaml>=6.0",
    "psycopg>=3.1.0",
    "psycopg-binary>=3.1.0",
    "requests>=2.28.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
nexus-parser = "nexus_parser.cli:main"
nexus-worker = "nexus_parser.worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

